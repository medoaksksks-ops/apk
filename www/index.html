<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,minimum-scale=1">

<title>TITAN HUB V6.5 - مركز المشاهدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d14;--s1:#121622;--line:rgba(255,255,255,.1);--text:#eef0f6;--muted:#9aa3b8;--gold:#ffb340;--gold2:#ff8a3d;--ember:#ef6f3c;--mint:#8fd3b6}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#hub{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));max-width:1100px;margin:0 auto;isolation:isolate}
#hub:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 360px at 85% 8%,rgba(255,179,64,.16),transparent 70%),radial-gradient(520px 380px at 12% 95%,rgba(239,111,60,.15),transparent 70%)}
.top{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--ember));display:grid;place-items:center;color:#1a1205}
.logo svg{width:20px;height:20px;fill:currentColor}
.top span:last-child{color:var(--muted);font-weight:600;font-size:13px;margin-inline-start:auto}
.intro{padding:34px 0 26px}
.hi{color:var(--gold);font-weight:700;font-size:15px;margin-bottom:6px}
h1{font-size:clamp(32px,7.2vw,58px);font-weight:800;line-height:1.25;max-width:14ch}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin-top:10px;font-size:15px}
.tiles{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:300px;padding:24px;border-radius:28px;text-align:start;border:1px solid var(--line);transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,border-color .3s}
.tile.yt{background:radial-gradient(120% 90% at 100% 0,rgba(255,179,64,.38),transparent 62%),linear-gradient(160deg,#2a1f0d,#14100a)}
.tile.mv{background:radial-gradient(120% 90% at 100% 0,rgba(239,111,60,.42),transparent 62%),linear-gradient(160deg,#2b140d,#140b09)}
.tile:hover,.tile:focus-visible{transform:translateY(-6px);outline:0}
.tile.yt:hover,.tile.yt:focus-visible{border-color:var(--gold);box-shadow:0 22px 50px rgba(255,179,64,.2)}
.tile.mv:hover,.tile.mv:focus-visible{border-color:var(--ember);box-shadow:0 22px 50px rgba(239,111,60,.24)}
.tile:active{transform:scale(.98)}
.bgi{position:absolute;inset-inline-end:-30px;bottom:-34px;width:230px;height:230px;opacity:.09;pointer-events:none;transform:rotate(-12deg);transition:transform .5s,opacity .3s}
.bgi svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tile:hover .bgi{transform:rotate(0) scale(1.08);opacity:.15}
.ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center}
.yt .ico{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1205}
.mv .ico{background:var(--ember);color:#fff}
.ico svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tt b{display:block;font-size:28px;font-weight:800;line-height:1.3}
.tt p{color:#c3c9d8;font-size:14px;margin-top:4px}
.feats{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.feats i{font-style:normal;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:600;color:#dde1ee}
.go{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:10px 20px;border-radius:99px;font-weight:800;font-size:14px}
.yt .go{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1205}
.mv .go{background:var(--ember);color:#fff}
.go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.tile:hover .go svg{transform:translateX(-5px)}
.last{position:absolute;top:18px;inset-inline-end:18px;padding:3px 11px;border-radius:99px;background:rgba(143,211,182,.16);color:var(--mint);font-size:11px;font-weight:700}
.hint{color:var(--muted);font-size:12px;text-align:center;padding-top:20px}
.credit{display:flex;align-items:center;gap:14px;margin:22px auto 6px;padding:12px 16px 12px 12px;width:min(420px,100%);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .25s,border-color .25s,box-shadow .25s}
.credit:hover,.credit:focus-visible{transform:translateY(-3px);border-color:#37aee2;box-shadow:0 14px 34px rgba(55,174,226,.2);outline:0}
.credit .tg{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#37aee2,#1e96c8);color:#fff}
.credit .tg svg{width:26px;height:26px;fill:currentColor;margin-inline-end:2px}
.credit .tx{flex:1;min-width:0;line-height:1.45}
.credit .tx small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.credit .tx b{display:block;font-size:17px;font-weight:800;direction:ltr;text-align:right;letter-spacing:.2px}
.credit .ar{flex:none;color:#37aee2}
.credit .ar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#stage{position:fixed;inset:0;background:var(--bg)}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#ld{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:2}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:700px){
 .tiles{grid-template-columns:1fr;gap:14px}
 .tile{min-height:0;padding:20px;border-radius:24px;gap:20px}
 .tt b{font-size:24px}
 .bgi{width:170px;height:170px}
 .intro{padding:26px 0 20px}
 .hint{display:none}
}
body *{font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}

@media(max-width:700px){.tile{min-height:250px}.hub-dl-copy small{font-size:11px}.hub-downloads{padding:13px;border-radius:18px;gap:11px}.hub-dl-go{font-size:11px}.hub-dl-ico{width:42px;height:42px;border-radius:13px}}

'use strict';

pt>\n'use strict';\n/* ==========================================================\n   ع رواقة v11.0\n   ========================================================== */\nconst VERSION='v15.0';\nconst API='https://supportive-contentment-production-a299.up.railway.app';\nconst CDN='https://laroza1.lat';\nconst TITLE='ع رواقة | اتفرج على مزاجك';\nconst SRV_TIMEOUT=14000;\nconst MOODS=[['smile','كوميدي','كوميدي'],['bolt','أكشن','أكشن'],['ghost','رعب','رعب'],['heart','رومانسي','رومانسي'],['masks','دراما','دراما'],['search','غموض وجريمة','جريمة'],['rocket','خيال علمي','خيال علمي'],['star','أطفال وأنيميشن','انيميشن']];\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst isRamCat=(k,v)=>/ramadan|رمضان/i.test(k+' '+(v&&v.name||''));\nconst ic=(n,c)=>`<svg class=\"i${c?' '+c:''}\" aria-hidden=\"true\"><use href=\"#i-${n}\"/><\/svg>`;\n\n/* ---------- تخزين محلي آمن ---------- */\nconst LS={\n get(k,d){try{const v=localStorage.getItem('3r_'+k);return v?JSON.parse(v):d}catch{return d}},\n set(k,v){try{localStorage.setItem('3r_'+k,JSON.stringify(v))}catch{}}\n};\nconst DEF_PREF={theme:'dark',adBlock:true,host:'',dens:'',calm:true,auto:true,allSrv:false,epDesc:false,autoNext:true,rate:1,vol:1,muted:false};\nlet favs=LS.get('favs',[]),hist=LS.get('hist',[]),recent=LS.get('recent',[]),seen=LS.get('seen',[]),pref=Object.assign({},DEF_PREF,LS.get('pref',{}));\nif(!Array.isArray(favs))favs=[];if(!Array.isArray(hist))hist=[];if(!Array.isArray(recent))recent=[];if(!Array.isArray(seen))seen=[];\nconst savePref=()=>LS.set('pref',pref);\nif(!pref.lite16){pref.calm=true;pref.lite16=1;savePref();}\nconst seenSet=()=>new Set(seen);\nfunction markSeen(vid){if(seen.includes(vid))return;seen.push(vid);if(seen.length>800)seen=seen.slice(-800);LS.set('seen',seen)}\n\n/* ---------- حالة عامة ---------- */\nlet cur='',embeds=[],idx=-1,wd=null,loaded=false,tok=0,srvTok=0,cats={},R=null,spots=[],si=0,spotTimer=null,theaterOn=false,homeRaw=[],EP={all:[],vid:'',season:0,se ^|[^a-z0-9])(?:hd|fhd|4k|1080p|720p|480p|web-?dl|webrip|blu-?ray|hdrip|dvdrip|hdcam)(?![a-z0-9])/gi,'$1 ')\n    .replace(/\\s*\\|\\s*/g,' - ');\n let s=0,e=0,m;\n if((m=x.match(/(^|[^a-z])s(?:eason)?\\s*0*(\\d{1,2})\\s*[-_. ]*e(?:p(?:isode)?)?\\s*0*(\\d{1,4})(?![a-z\\d])/i))){s=+m[2];e=+m[3];x=x.replace(m[0],m[1]+' ')}\n if(!s&&(m=x.match(/(^|[^a-z])season\\s*0*(\\d{1,2})(?![a-z\\d])/i))){s=+m[2];x=x.replace(m[0],m[1]+' ')}\n if(!s&&(m=x.match(/(^|\\s)(?:ال)?موسم\\s*(?:ال)?(\\d{1,2}|[^\\s\\d]+)/))){\n  const v=/^\\d/.test(m[2])?+m[2]:ordOf(m[2]);\n  if(v){s=v;x=x.replace(m[0],m[1]+' ')}\n }\n /* مهم: لازم حرف قبل ep يكون مش حرف إنجليزي، عشان أسماء زي Creep 2 / Sleep 2 ما تتقصّش */\n if(!e&&(m=x.match(/(^|[^a-z])(?:episode|ep)\\.?\\s*0*(\\d{1,4})(?![a-z\\d])/i))&&m.index+m[1].length>0){e=+m[2];x=x.replace(m[0],m[1]+' ')}\n if(!e&&(m=x.match(/(^|\\s)(?:ال)?حلق[هة]\\s*(?:رقم\\s*)?(?:ال)?(\\d{1,4}|[^\\s\\d]+)/))){\n  const v=/^\\d/.test(m[2])?+m[2]:ordOf(m[2]);\n  if(v){e=v;x=x.replace(m[0],m[1]+' ')}\n }\n let toks=x.split(' ').filter(t=>t&&!JUNKW.has(norm(t)));\n while(toks.length>1&&LEADW.has(norm(toks[0])))toks.shift();\n let name=toks.join(' ').replace(/(\\s*[-–—:]\\s*){2,}/g,' - ').replace(/^[\\s\\-–—|:·.,،]+|[\\s\\-–—|:·.,،]+$/g,'').replace(/\\s+/g,' ');\n if(!name)name=decEnt(key).replace(/[\\u200b-\\u200f\\u202a-\\u202e\\u2066-\\u2069\\ufeff]/g,'').trim();\n const P={name,season:s,ep:e};\n if(PMEMO.size>3000)PMEMO.clear();\n PMEMO.set(key,P);return P;\n}\nconst fullTitle=P=>P.name+(P.season?' — الموسم '+P.season:'')+(P.ep?' — الحلقة '+P.ep:'');\nconst T=t=>fullTitle(parseTitle(t));\nconst cleanT=t=>parseTitle(t).name;\nfunction canon(n){return norm(n).replace(/[^\\p{L}\\p{N}]+/gu,'')}\nconst isEp=t=>parseTitle(t).ep>0;\n/* عزل اتجاه النص عشان الأسماء المختلطة عربي/إنجليزي ما تتبدّلش */\nconst bdi=t=>'<bdi>'+esc(t)+'<\/bdi>';\n/* تنسيق مدة الفيلم مهما كان شكلها في الـ API */\nfunction formatDuration(value){\n if(value===null||value===undefined||value==='')return \nfunction surprise(){\n const pool=[...reg.values()].filter(v=>v.vid);\n if(!pool.length)return toast('استنى لحظة لحد ما المكتبة تحمّل');\n const v=pool[Math.floor(Math.random()*pool.length)];\n toast('جرّب: '+cleanT(v.title));\n location.hash=hrefOf(v).slice(1);\n}\n\n/* ---------- مصادر القوائم ---------- */\nasync function fetchCat(k,p){\n return(await api('/api/category/'+enc(k)+'?page='+p,55000,300000)).videos||[];\n}\nasync function searchAll(q,p=1){\n try{return(await api('/api/search?q='+enc(q)+(p>1?'&page='+p:''),60000,300000)).videos||[]}\n catch(e){\n  if(p>1)return[];\n  const l=((await api('/api/search/local?q='+enc(q),12000,300000).catch(()=>({})))||{}).results||[];\n  if(l.length)return l;throw e;\n }\n}\nconst favSrc=()=>({title:'قائمتي',group:false,load:async()=>favs.slice(),empty:'قائمتك فاضية. دوس على القلب في أي فيلم أو مسلسل عشان يتضاف هنا.'});\nfunction catEntries(type){\n const src=Array.isArray(cats)?cats.map((c,i)=>[c?.id??c?.slug??i,c]):Object.entries(cats||{});\n return src.filter(([k,c])=>c&&c.type===type&&!isRamCat(k,c));\n}\nasync function typeItems(type,p){\n const ent=catEntries(type);\n if(!ent.length){\n  if(p>1)return[];\n  let l=homeRaw.slice();\n  try{l=l.concat((await api('/api/videos?limit=300',15000,120000)).videos||[])}catch{}\n  return l.filter(v=>(isSer(v)||isEp(v.title))===(type==='series'));\n }\n const rs=await Promise.allSettled(ent.map(([k])=>fetchCat(k,p)));\n const arr=rs.filter(r=>r.status==='fulfilled').map(r=>r.value);\n if(!arr.length&&p===1)throw(rs[0]&&rs[0].reason)||Error('تعذر تحميل القائمة');\n const out=[];\n for(let i=0;arr.some(a=>i<a.length);i++)arr.forEach(a=>{if(a[i])out.push(a[i])});\n return out;\n}\n\n/* ---------- صفحة النتائج (تحميل لا نهائي + فلترة + ترتيب) ---------- */\nfunction show(id){\n ['homeView','resultsView','playerView'].forEach(x=>{\n  const e=$('#'+x);e.classList.toggle('hidden',x!==id);\n  if(x===id){e.style.animation='none';e.offsetHeight;e.style.animation=''}\n });\n}\nfunction addItems(l){\n let n=0;\n for(const v of l||[]){if(v&&v.vid&&!R.seen.has(v.vid)){R.seen.add(v.vid);R.list.push(v);n++}}\n return n;\n}\nasync function openResults(src){\n const my=++tok;\n show('resultsView');\n R={src,my,list:[],seen:new Set(),page:1,done:!src.paged,busy:false,group:src.group!==false,q:'',sort:'def',follow:'all',kind:'all'};\n $('#rTitle').textContent=src.title;$('#rSub').textContent='';\n $('#rf').value='';$('#rs').value='def';$('#rt').value='all';\n $('#rg').setAttribute('aria-pressed',String(R.group));\n $$('#rseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v==='all')));\n $('#more').classList.add('hidden');\n const g=$('#rGrid');g.innerHTML=skels(12);\n try{\n  const l=await src.load(1);\n  if(my!==tok)return;\n  if(!addItems(l)){\n   R.done=true;\n  }\n  paint();\n }catch(e){if(my===tok)fail(g,e,()=>openResults(src))}\n}\nconst serOf=v=>!!v.ser||isSer(v)||isEp(v.title);\nconst rateOf=v=>Number(String(v.rating??'').replace(/[^\\d.]/g,''))||0;\nconst yearOf=v=>+((String(v.year||'').match(/\\d{4}/)||[0])[0]);\nconst nameKey=v=>norm(parseTitle(v.title).name||v.title);\nconst filtersOn=()=>!!(R&&(R.q||R.kind!=='all'||R.follow!=='all'||R.sort!=='def'));\nfunction clearFilters(){\n if(!R)return;R.q='';R.sort='def';R.kind='all';R.follow='all';\n $('#rf').value='';$('#rs').value='def';$('#rt').value='all';\n $$('#rseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v==='all')));paint();\n}\nfunction paint(){\n if(!R)return;\n let l=R.list;\n if(R.group)l=group(l);\n if(R.kind==='movie')l=l.filter(v=>!serOf(v));else if(R.kind==='series')l=l.filter(serOf);\n const toks=norm(R.q).split(/\\s+/).filter(Boolean);\n if(toks.length)l=l.filter(v=>{const h=norm(v.title)+' '+nameKey(v);return toks.every(t=>h.includes(t))});\n if(R.follow!=='all'){\n  const ss=seenSet(),want=R.follow==='follow';\n  l=l.filter(v=>(v.vids||[v.vid]).some(x=>ss.has(x))===want);\n }\n if(R.sort==='def'&&R.src.q){const qq=norm(R.src.q),sc=v=>{const n=nameKey(v);return n===qq?0:n.startsWith(qq)?1:n.split(' ').some(w=>w.startsWith(qq))?2:3};l=l.map((v,i)=>[v,sc(v),i]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(x=>x[0])}\n else if(R.sort==='az'||R.sort==='za'){l=[...l].sort((a,b)=>nameKey(a).localeCompare(nameKey(b),'ar'));if(R.sort==='za')l.reverse()}\n else if(R.sort==='new')l=l.map((v,i)=>[v,i]).sort((a,b)=>yearOf(b[0])-yearOf(a[0])||a[1]-b[1]).map(x=>x[0]);\n else if(R.sort==='rate')l=l.map((v,i)=>[v,i]).sort((a,b)=>rateOf(b[0])-rateOf(a[0])||a[1]-b[1]).map(x=>x[0]);\n const on=filtersOn();\n const emptyMsg=l.length?'':(on?'مفيش نتايج بالفلاتر دي.<br><button class=\"btn line\" type=\"button\" data-clr>'+ic('close')+'امسح الفلاتر<\/button>':(R.src.empty||''));\n const g=$('#rGrid'),keys=l.map(v=>v.vid),pk=R.pk||[];\n const has=!!g.querySelector('.cw');\n if(has&&keys.length&&keys.length>=pk.length&&pk.length&&pk.every((k,i)=>k===keys[i])){\n  if(keys.length>pk.length)g.insertAdjacentHTML('beforeend',l.slice(pk.length).map((v,i)=>card(v,pk.length+i)).join(''));\n }else render(g,l,emptyMsg);\n R.pk=keys;\n $('#rSub').textContent=l.length?`${l.length} عنصر`+(on?' بعد الفلترة':''):'';\n $('#rclr').classList.toggle('hidden',!on);\n $('#more').classList.toggle('hidden',R.done||R.busy);\n $('#moreSpin').classList.toggle('hidden',!R.busy);\n setTimeout(nearEnd,60);\n}\nasync function loadMore(){\n const r=R;\n if(!r||r.done||r.busy||r.my!==tok||r.page>=15)return;\n r.busy=true;$('#more').classList.add('hidden');$('#moreSpin').classList.remove('hidden');\n try{\n  const l=await r.src.load(r.page+1);\n  if(r.my!==tok)return;\n  r.page++;\n  if(!addItems(l))r.done=true;\n }catch(e){r.done=true;toast(e.message)}\n finally{r.busy=false;if(r.my===tok)paint()}\n}\nfunction nearEnd(){\n if(!R||R.done||R.busy||$('#resultsView').classList.contains('hidden'))return;\n if($('#moreBox').getBoundingClientRect().top<innerHeight+500)loadMore();\n}\n\n/* ---------- المشغل وقايمة السيرفرات ---------- */\n\nfunction badge(txt){\n const b=$('#srvBadge');\n if(!txt){b.classList.add('hidden');return}\n b.innerHTML='<i class=\"mini-spin\"><\/i>'+esc(txt);b.classList.remove('hidden');\n}\nfunction stopEmbed(){\n clearTimeout(wd);srvTok++;badge('');\n const f=$('#frame');f.onload=null;f.src='about:blank';loaded=false;\n}\nfunction stop(){stopEmbed();stopDirect()}\n/* ترتيب السيرفرات: الأساسي/المفضّل أولًا، والفاشل في الجلسة آخرًا، وإزالة المكرر */\nfunction buildEmbeds(raw){\n const seenU=new Set(),all=[];\n for(let e of raw||[]){\n  if(typeof e==='string')e={url:e};\n  if(!e||!isHttp(e.url)||seenU.has(e.url))continue;\n  seenU.add(e.url);all.push(e);\n }\n return all.map((e,k)=>({url:e.url,host:hostOf(e.url),name:hostName(e.url),st:'idle',k,primary:!!e.primary}))\n  .sort((a,b)=>{\n   const sa=(a.host===pref.host?-2:0)+(a.primary?-1:0)+(badHosts.has(a.host)?2:0),sb=(b.host===pref.host?-2:0)+(b.primary?-1:0)+(badHosts.has(b.host)?2:0);\n   return sa-sb||a.k-b.k;\n  });\n}\nfunction drawSrv(){\n const box=$('#servers'),n=embeds.length;\n if(!n){box.innerHTML='<span class=\"m\">مفيش سيرفرات متاحة حاليًا.<\/span>';$('#srvNow').textContent='';return}\n box.innerHTML=embeds.map((e,k)=>{\n  const label=e.st==='try'?'جاري التشغيل':e.st==='ok'?'يعمل':e.st==='fail'?'لم يستجب':'جاهز';\n  const mark=e.st==='try'?'<i class=\"mini-spin\"><\/i>':e.st==='ok'?ic('check'):e.st==='fail'?ic('alert'):'<i class=\"srv-led\"><\/i>';\n  return `<button class=\"srv st-${e.st}${k===idx?' on':''}\" type=\"button\" data-i=\"${k}\" title=\"${esc(e.host)}\" aria-label=\"اختيار السيرفر ${k+1} ${esc(e.name)}\">\n   <em>${k+1}<\/em><span class=\"srv-info\"><b>${esc(e.name||'سيرفر '+(k+1))}<\/b><small>${esc(e.host)}<\/small><\/span><span class=\"srv-state\">${mark}<small>${label}<\/small><\/span>\n  <\/button>`;\n }).join('');\n const bad=embeds.filter(e=>e.st==='fail').length;\n $('#srvNow').innerHTML=(idx>-1?`سيرفر <bdi>${idx+1}<\/bdi> من <bdi>${n}<\/bdi>`:`<bdi>${n}<\/bdi> سيرفر`)+(bad?` — <bdi>${bad}<\/bdi> فاشل`:'');\n centerIn(box,box.querySelector('.on'));\n}\nfunction playEmbed(i,manual){\n if(!embeds[i])return;\n clearTimeout(wd);\n const my=++srvTok,e=embeds[i];\n idx=i;loaded=false;e.st='try';\n if(manual){pref.host=e.host;savePref()}\n $('#empty').classList.add('hidden');\n badge('جاري تشغيل سيرفر '+(i+1)+' ('+e.name+')');\n drawSrv();\n const f=$('#frame');\n f.onload=()=>{\n  if(my!==srvTok)return;\n  loaded=true;clearTimeout(wd);e.st='ok';badBack(e.host);badge('');drawSrv();\n };\n f.src=e.url;\n wd=setTimeout(()=>{\n  if(my!==srvTok||loaded)return;\n  e.st='fail';badHosts.add(e.host);badge('');drawSrv();\n  if(pref.auto){toast('سيرفر '+(i+1)+' اتأخر، بنجرب اللي بعده');skip(true)}\n  else toast('سيرفر '+(i+1)+' بطيء، جرّب سيرفر تاني من القايمة');\n },SRV_TIMEOUT);\n}\nfunction badBack(h){badHosts.delete(h)}\nfunction skip(auto){\n if(!embeds.length)return toast('مفيش سيرفرات بديلة');\n let k=-1;\n if(auto){for(let j=idx+1;j<embeds.length;j++){if(embeds[j].st!=='fail'){k=j;break}}}\n else if(embeds.length>1)k=(idx+1)%embeds.length;\n if(k<0){\n  if(!auto)return toast('ده السيرفر الوحيد المتاح');\n  clearTimeout(wd);stop();\n  const em=$('#empty');em.classList.remove('hidden');\n  em.innerHTML=`${ic('alert')}<div>جرّبنا كل السيرفرات المتاحة. ممكن تكون متوقفة مؤقتًا.<\/div><button class=\"btn main sm\" type=\"button\" id=\"again\">${ic('refresh')}جرّب كلهم تاني<\/button>`;\n  $('#again').onclick=resetSrv;\n  return toast('وصلنا لآخر سيرفر');\n }\n playEmbed(k);\n if(!auto)toast('انتقلنا للسيرفر التالي');\n}\nfunction resetSrv(){\n if(!embeds.length)return;\n badHosts.clear();embeds.forEach(e=>e.st='idle');idx=-1;\n playEmbed(0);\n}\n/* ترتيب الحلقات وتقسيمها لمواسم */\nfunction buildEps(list,seasonGroups){\n const flat=[];\n const pushGroup=(arr,seasonHint)=>{\n  if(!Array.isArray(arr))return;\n  arr.forEach(e=>{\n   if(!e)return;\n   if(Array.isArray(e.episodes)){pushGroup(e.episodes,e.season??e.season_number??e.number??seasonHint);return}\n   flat.push({...e,__seasonHint:e.__seasonHint??seasonHint});\n  });\n };\n if(Array.isArray(list))pushGroup(list,0);\n else if(list&&typeof list==='object')Object.entries(list).forEach(([k,v])=>{if(Array.isArray(v))pushGroup(v,k);else if(Array.isArray(v?.episodes))pushGroup(v.episodes,v.season??v.season_number??k);else if(v?.vid)flat.push({...v,__seasonHint:v.season??v.season_number??k})});\n if(seasonGroups&&(Array.isArray(seasonGroups)||typeof seasonGroups==='object')){\n  const groups=Array.isArray(seasonGroups)?seasonGroups:Object.entries(seasonGroups).map(([k,g])=>({...((g&&typeof g==='object')?g:{}),__key:k}));\n  const flatSeasons=[];\n  groups.forEach((g,i)=>{\n   const sn=g?.season??g?.season_number??g?.seasonNumber??g?.number??g?.__key??(i+1);\n   const eps=Array.isArray(g)?g:(g?.episodes||g?.items||[]);\n   if(Array.isArray(eps))eps.forEach(e=>flatSeasons.push({...e,__seasonHint:e?.season??e?.season_number??sn}));\n  });\n  if(flatSeasons.length>=flat.length&&flatSeasons.length)flat.splice(0,flat.length,...flatSeasons);\n }\n const seenV=new Set(),out=[];\n const num=v=>{if(v===null||v===undefined||v==='')return 0;const raw=String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));const n=Number(raw.match(/\\d+/)?.[0]||0);return Number.isFinite(n)&&n>0?n:0};\n const seasonNum=v=>{\n  const n=num(v);if(n)return n;\n  const p=parseTitle(String(v||''));return p.season||0;\n };\n flat.forEach((e,i)=>{\n  if(!e||!e.vid||seenV.has(e.vid))return;seenV.add(e.vid);\n  const a=parseTitle(e.label||e.name||''),b=parseTitle(e.title||'');\n  const season= a.season||b.season||seasonNum(e.season??e.season_number??e.seasonNumber??e.seasonIndex??e.__seasonHint)||0;\n  const ep= a.ep||b.ep||num(e.episode_number??e.episodeNumber??e.episode??e.ep??e.number??e.order??e.position);\n  out.push({vid:e.vid,i,season,ep,raw:T(e.label||e.name||e.title||'')});\n });\n if(!out.length)return out;\n /*\n  * بعض الـ APIs بترجع الحلقات بالشكل ده:\n  * الحلقة 1 للموسم الأول، ثم الحلقة 1 للموسم الثاني... وبعدها الحلقة 2\n  * مكررة بنفس الترتيب. في الحالة دي ترتيب تكرار رقم الحلقة هو رقم الموسم.\n  */\n const missing=out.some(x=>!x.season);\n if(missing){\n  const freq=new Map(),occurrence=new Map();\n  out.forEach(x=>{if(x.ep)freq.set(x.ep,(freq.get(x.ep)||0)+1)});\n  const hasRepeatedEpisodes=[...freq.values()].some(n=>n>1);\n  if(hasRepeatedEpisodes){\n   out.forEach(x=>{\n    if(x.season||!x.ep)return;\n    const seen=(occurrence.get(x.ep)||0)+1;\n    occurrence.set(x.ep,seen);\n    x.season=seen;\n   });\n   /* الحلقات اللي رقمها مش معروف تلحق بآخر موسم معروف */\n   let lastSeason=1;\n   out.forEach(x=>{if(x.season)lastSeason=Math.max(lastSeason,x.season);else x.season=lastSeason});\n  }else{\n   const nums=out.map(x=>x.ep).filter(Boolean);\n   if(nums.length>1){\n    const desc=nums.slice(1).filter((n,i)=>n<nums[i]).length>nums.slice(1).filter((n,i)=>n>nums[i]).length;\n    const seq=desc?[...out].reverse():out;\n    let sn=1,prev=0;\n    seq.forEach(x=>{\n     if(x.season){sn=x.season;prev=x.ep||0;return}\n     if(x.ep&&prev&&x.ep<=prev)sn++;\n     x.season=sn;if(x.ep)prev=x.ep;\n    });\n   }\n  }\n }\n out.forEach(x=>{if(!x.season)x.season=1});\n out.sort((p,q)=>p.season-q.season||(p.ep&&q.ep?p.ep-q.ep:(p.ep?-1:(q.ep?1:0)))||p.i-q.i);\n const cnt={};out.forEach(x=>{cnt[x.season]=(cnt[x.season]||0)+1;x.n=x.ep||cnt[x.season]});\n return out;\n}\nconst multiSeason=()=>EP.seasons.length>1;\nconst epLab=x=>(multiSeason()?'الموسم '+x.season+' — ':'')+'الحلقة '+x.n;\nfunction drawEps(){\n const all=EP.all,vid=EP.vid,ss=seenSet();\n if(!all.length)return;\n EP.seasons=[...new Set(all.map(x=>x.season))].sort((a,b)=>a-b);\n if(!EP.seasons.includes(EP.season))EP.season=EP.seasons[0];\n const sb=$('#seasons');\n sb.classList.toggle('hidden',EP.seasons.length<2);\n sb.innerHTML=EP.seasons.length>1?EP.seasons.map(n=>{const count=all.filter(x=>x.season===n).length;return `<button type=\"button\" data-s=\"${n}\" aria-pressed=\"${n===EP.season}\">الموسم ${n} <small>(${count})<\/small><\/button>`}).join(''):' const TITLES={yt:'TITAN TUBE v9.4',movies:'TITAN MOVIES V6 | اتفرج على مزاجك'};
const HUB_TITLE='TITAN HUB V6.5 - مركز المشاهدة';
let ytRoute='/',ytTitle='',pendingGo=null;
const hub=document.getElementById('hub'),stage=document.getElementById('stage');
let cur='',blobUrl='';
const appFrames = Object.create(null);

(function greet(){
  const h=new Date().getHours();
  document.getElementById('hi').textContent=h<5?'سهرانين؟ أهلًا بيك':h<12?'صباح الخير':h<17?'نهارك سعيد':h<21?'مساء الخير':'سهرة حلوة';
  try{document.getElementById('clk').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}catch{}
  try{const l=localStorage.getItem('hub_last');if(l){const b=document.querySelector('[data-app="'+l+'"] .last');b&&b.classList.remove('hidden')}}catch{}
})();

function destroy(){
  Object.values(appFrames).forEach(f=>f.classList.add('hidden'));
  if(blobUrl){try{URL.revokeObjectURL(blobUrl)}catch{}blobUrl=''}
  cur='';
}
function showHub(){
  if(cur && appFrames[cur]) {
    try { appFrames[cur].contentWindow.postMessage({titanHubHidden:true},'*'); } catch {}
    appFrames[cur].classList.add('hidden');
    if(cur==='movies') { appFrames[cur].remove(); delete appFrames[cur]; }
  }
  cur='';
  stage.classList.add('hidden');hub.classList.remove('hidden');
  document.title=HUB_TITLE;scrollTo(0,0);
}
function openApp(k,push){
  if(!SRC[k])return null;
  if(cur && cur!==k && appFrames[cur]) {
    try { appFrames[cur].contentWindow.postMessage({titanHubHidden:true},'*'); } catch {}
    appFrames[cur].classList.add('hidden');
    if(cur==='movies') { appFrames[cur].remove(); delete appFrames[cur]; }
  }
  let f=appFrames[k];
  if(!f){
    f=document.createElement('iframe');
    f.setAttribute('allow','autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write');
    f.setAttribute('allowfullscreen','');
    f.title=TITLES[k];
    f.className='hidden';
    const ld=document.createElement('div');ld.id='ld';ld.innerHTML='<div class="spin"></div>';
    f.addEventListener('load',()=>{ld.remove();f.dataset.ready='1'},{once:true});
    stage.append(f,ld);
    appFrames[k]=f;
    f.srcdoc=SRC[k].replace('<head>',()=>'<head><base href="about:srcdoc">');
  }
  cur=k;f.classList.remove('hidden');
  try{localStorage.setItem('hub_last',k)}catch{}
  hub.classList.add('hidden');stage.classList.remove('hidden');
  document.title=TITLES[k];
  if(push){try{history.pushState({app:k,route:k==='yt'?ytRoute:'/',depth:0},'','#'+k+(k==='yt'&&ytRoute!=='/'?ytRoute:''))}catch{}}
  return f;
}
document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app,true)));
document.getElementById('hubDownloads')?.addEventListener('click',()=>{
  const f=openApp('yt',true); if(!f)return;
  const go=()=>{try{f.contentWindow.postMessage({titanNavigate:'/downloads'},'*')}catch{}};
  if(f.dataset.ready==='1')go();else f.addEventListener('load',()=>setTimeout(go,120),{once:true});
  setTimeout(go,900);
});
addEventListener('keydown',e=>{
  if(cur||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='1')openApp('yt',true);else if(e.key==='2')openApp('movies',true);
});
/* ===== v6.1: روابط لكل صفحة (#yt/watch/ID) ===== */
function parseHash(){
  const h=location.hash.replace(/^#/,'');const m=h.match(/^(yt|movies)(\/.*)?$/);
  return m?{app:m[1],route:m[2]||'/'}:null;
}
function sendGo(f,route,depth){
  const go=()=>{try{f.contentWindow.postMessage({titanGo:route,depth:depth||0},'*')}catch{}};
  if(f.dataset.ready==='1')go();else f.addEventListener('load',()=>setTimeout(go,60),{once:true});
  [350,900,1800,3500].forEach(ms=>setTimeout(()=>{if(pendingGo===route&&f.dataset.ready==='1')go()},ms));
}
function openFromHash(){
  const p=parseHash();
  if(!p){if(cur)showHub();return}
  const f=openApp(p.app,false);if(!f)return;
  if(p.app==='yt'){ytRoute=p.route;pendingGo=p.route==='/'?null:p.route;sendGo(f,p.route,(history.state&&history.state.depth)||0)}
}
addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d!=='object')return;
  if(d.hub&&cur){showHub();try{history.replaceState(null,'',location.pathname+location.search)}catch{}return}
  if(cur!=='yt')return;
  if(d.titanRoute!=null){
    const nr=String(d.titanRoute)||'/';
    if(pendingGo){if(nr!==pendingGo)return;pendingGo=null}
    ytRoute=nr;
    const url='#yt'+(ytRoute==='/'?'':ytRoute),dp=+d.depth||0;
    if(location.hash!==url){
      const st=history.state||{};
      try{(dp>(st.depth||0)?history.pushState:history.replaceState).call(history,{app:'yt',route:ytRoute,depth:dp},'',url)}catch{}
    }
  }
  if(d.titanTitle){ytTitle=String(d.titanTitle);document.title=ytTitle+' · TITAN TUBE'}
  if(d.titanDlCount!=null){const b=document.getElementById('hubDownloads');if(b){if(+d.titanDlCount>0)b.dataset.n=d.titanDlCount;else delete b.dataset.n}}
});
addEventListener('popstate',openFromHash);
addEventListener('hashchange',()=>{if(!history.state)openFromHash()});
if(parseHash())openFromHash();
